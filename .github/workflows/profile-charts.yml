name: Refresh profile charts

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 06:17 Türkiye time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/static.json"
      - ".github/workflows/profile-charts.yml"

permissions:
  contents: write

concurrency:
  group: profile-charts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_ROOT: .
        run: python scripts/fetch_data.py

      - name: Draw charts
        env:
          PROFILE_ROOT: .
        run: python scripts/build_visual.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile charts"
            git push
          fi
